<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Minecraft Shop Calculator</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --border: #4a4a4a; --text: #f0f0f0; --gold: #ffaa00; --dia: #55ffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .calculator-card { background: var(--card); border: 3px solid var(--border); border-radius: 8px; padding: 20px; width: 100%; max-width: 700px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--gold); margin: 0 0 15px 0; text-transform: uppercase; font-size: 22px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .item-list { max-height: 400px; overflow-y: auto; margin-bottom: 15px; }
        .item-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; background: #222; padding: 8px; border-radius: 4px; border-left: 4px solid var(--gold); }
        .row-num { font-weight: bold; color: #888; min-width: 20px; }
        select, input { background: #333; color: #fff; border: 1px solid var(--border); padding: 6px; border-radius: 4px; }
        select { flex: 2; } input { width: 70px; }
        .btn-gp { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { flex: 1; padding: 10px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; min-width: 120px; }
        .btn-calc { background: #5c8e32; color: white; } .btn-reset { background: #8b0000; color: white; }
        .btn-lang { background: #3a5b8c; color: white; }
        .results-box { background: #151515; border: 2px solid var(--border); border-radius: 6px; padding: 15px; display: none; }
        .results-box.active { display: block; }
        .currency-total { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
        .t-iron { border: 1px solid var(--gold); color: var(--gold); background: rgba(255,170,0,0.05); }
        .t-dia { border: 1px solid var(--dia); color: var(--dia); background: rgba(85,255,255,0.05); }
        .t-main { border: 2px dashed #ff55ff; color: #ff55ff; background: rgba(255,85,255,0.05); font-size: 21px; margin-top: 12px; }
        .bd { font-size: 12px; color: #888; text-align: right; margin-top: 3px; }
    </style>
</head>
<body>
<div class="calculator-card">
    <h1 id="titleText">Shop Price Calculator</h1>
    <div class="item-list" id="list"></div>
    <div class="btn-gp">
        <button class="btn-lang" id="langBtn" onclick="toggleLanguage()">Język: PL</button>
        <button class="btn-reset" id="resetBtn" onclick="resetForm()">Clear All</button>
        <button class="btn-calc" id="calcBtn" onclick="calculate()">Confirm & Calculate</button>
    </div>
    <div class="results-box" id="res">
            <div class="currency-total-1-iron"><span id="lblIron">Diamonds:</span><span id="idIron">0</span> Dia</div>
            <div class="currency-total-1-dia"><span id="lblDia">Iron Ingots:</span><span id="idDia">0</span> Ingot</div>
            <div class="currency-total-1-main"><span id="lblMain">Main Total Due:</span><div class="mTot" id="mTot">0 Dia + 0 Nug</div></div>
        </div>
</div>
<script>
    let currentLang = 'en';
    const shopData = [
        { value: 0, text: { en: "-- Select Item --", pl: "-- Wybierz przedmiot --" } },
        { group: { en: "General", pl: "Ogólne" }, items: [
            { value: 8, text: { en: "Log Stack", pl: "Stak Drewna" } },
            { value: 4, text: { en: "Cobble Stack", pl: "Stak Bruku" } },
            { value: 9, text: { en: "Iron Ingot", pl: "Sztabka Żelaza" } },
            { value: 72, text: { en: "Golden Apple", pl: "Złote Jabłko" } },
            { value: 100, text: { en: "Diamond", pl: "Diament" } },
            { value: 256, text: { en: "Netherite Scrap", pl: "Odłamek Netheritu" } },
            { value: 12, text: { en: "Glowstone Blk", pl: "Blok Jasnogłazu" } },
            { value: 128, text: { en: "Mending Book", pl: "Księga Naprawy" } },
            { value: 192, text: { en: "Shulker Box", pl: "Skrzynia Shulkera" } },
            { value: 16, text: { en: "Steak Stack", pl: "Stak Steków" } }
        ]},
        { group: { en: "Potions (Single)", pl: "Mikstury (1 szt.)" }, items: [
            { value: 18, text: { en: "Harming/Poison", pl: "Obrażenia/Trucizna" } },
            { value: 24, text: { en: "Healing/Regen", pl: "Leczenie/Regeneracja" } },
            { value: 16, text: { en: "Buff (Strength/Speed)", pl: "Wzmocnienia (Siła/Szybkość)" } },
            { value: 12, text: { en: "Misc (Water/Fire)", pl: "Użyteczne (Ogień/Woda)" } }
        ]},
        { group: { en: "Arrows (Stack)", pl: "Strzały (Stak)" }, items: [
            { value: 8, text: { en: "Regular", pl: "Zwykłe" } },
            { value: 32, text: { en: "Harming/Poison", pl: "Obrażenia/Trucizna" } },
            { value: 40, text: { en: "Healing/Regen", pl: "Leczenie/Regeneracja" } },
            { value: 24, text: { en: "Misc Tipped", pl: "Inne z efektem" } }
        ]},
        { group: { en: "Fireworks (Stack)", pl: "Fajerwerki (Stak)" }, items: [
            { value: 16, text: { en: "Duration 1", pl: "Czas lotu 1" } },
            { value: 24, text: { en: "Duration 2", pl: "Czas lotu 2" } },
            { value: 32, text: { en: "Duration 3", pl: "Czas lotu 3" } }
        ]},
        { group: { en: "Armor Trims & Upgrades", pl: "Szablony kowalskie" }, items: [
            { value: 102, text: { en: "Netherite Upgrade Template", pl: "Ulepszenie Netheritu" } },
            { value: 128, text: { en: "Common Trim", pl: "Zwykły Szablon" } },
            { value: 142, text: { en: "Medium Trim", pl: "Średni Szablon" } },
            { value: 163, text: { en: "Rare Trim", pl: "Rzadki Szablon" } },
            { value: 400, text: { en: "Silence Trim", pl: "Szablon Silence" } }
        ]},
        { group: { en: "Map Locations", pl: "Usługi Kartograficzne" }, items: [
            { value: 450, text: { en: "Basic Location", pl: "Podstawowa lokacja" } },
            { value: 1500, text: { en: "Cartographer Location", pl: "Lokacja z mapy" } },
            { value: 3000, text: { en: "Advanced Location", pl: "Zaawansowana lokacja" } },
            { value: 4800, text: { en: "Custom Exploration", pl: "Eksploracja na życzenie" } }
        ]},
        { group: { en: "Materials", pl: "Materiały" }, items: [
            { value: 60, text: { en: "Lapis lazuli", pl: "Lazuryt" } }
        ]}
    ];

    const uiText = {
        en: { title: "Shop Price Calculator", calc: "Confirm & Calculate", reset: "Clear All", lang: "Language: PL", iron: "Diamonds:", dia: "Iron Ingots:", main: "Main Total Due:", blkText: (b, i, n) => `${b} Blk, ${i} Ing, ${n} Nug`, diaBlkText: (b, d) => `${b} Blk, ${d} Dia`, mainText: (d, n) => `${d} Dia + ${n} Nug` },
        pl: { title: "Kalkulator Cen Sklepu", calc: "Potwierdź i Oblicz", reset: "Wyczyść Wszystko", lang: "Language: EN", iron: "Diamenty:", dia: "Sztabki Żelaza:", main: "Do Zapłaty:", blkText: (b, i, n) => `${b} Blk, ${i} Sztab, ${n} Sam`, diaBlkText: (b, d) => `${b} Blk, ${d} Dia`, mainText: (d, n) => `${d} Dia + ${n} Sam` }
    };

    function buildDropdownMarkup(lang) {
        let markup = `<option value="0">${shopData[0].text[lang]}</option>`;
        for(let i=1; i<shopData.length; i++) {
            markup += `<optgroup label="${shopData[i].group[lang]}">`;
            shopData[i].items.forEach(item => { markup += `<option value="${item.value}">${item.text[lang]}</option>`; });
            markup += `</optgroup>`;
        }
        return markup;
    }

    function initLayout() {
        const container = document.getElementById('list');
        let html = "", markup = buildDropdownMarkup(currentLang);
        for (let i = 1; i <= 20; i++) {
            html += `<div class="item-row"><span class="row-num">${i}</span><select class="sel">${markup}</select><input type="number" class="qty" placeholder="Qty" min="1"></div>`;
        }
        container.innerHTML = html;
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'en') ? 'pl' : 'en';
        document.getElementById('titleText').innerText = uiText[currentLang].title;
        document.getElementById('calcBtn').innerText = uiText[currentLang].calc;
        document.getElementById('resetBtn').innerText = uiText[currentLang].reset;
        document.getElementById('langBtn').innerText = uiText[currentLang].lang;
        document.getElementById('lblIron').innerText = uiText[currentLang].iron;
        document.getElementById('lblDia').innerText = uiText[currentLang].dia;
        document.getElementById('lblMain').innerText = uiText[currentLang].main;

        const selects = document.querySelectorAll('.sel');
        const currentMarkup = buildDropdownMarkup(currentLang);
        selects.forEach(select => {
            const savedValue = select.value;
            select.innerHTML = currentMarkup;
            select.value = savedValue;
        });
        if(document.getElementById('res').classList.contains('active')) { calculate(); }
    }

    function calculate() {
        let total = 0;
        const sels = document.querySelectorAll('.sel'), qtys = document.querySelectorAll('.qty');
        sels.forEach((s, idx) => {
            let p = parseInt(s.value), q = parseInt(qtys[idx].value);
            if (p > 0 && q > 0) total += (p * q);
        });

        // Logika przeliczeń dla dolnej sekcji (pozostaje oryginalna)
        let ironBlk = Math.floor(total / 81), rawIng = total % 81, ironIng = Math.floor(rawIng / 9), nug = rawIng % 9;
        let rawDia = Math.floor(total / 81), diaBlk = Math.floor(rawDia / 9), remD = rawDia % 9, mainNuggets = total % 81;
        
        // NOWA LOGIKA dla dwóch pierwszych linii:
        // Linia 1: Czyste diamenty z całości ceny
        let displayDiamonds = Math.floor(total / 81); 
        // Linia 2: Reszta, która nie zmieściła się w diamentach, przeliczona na sztabki żelaza
        let displayIronIngots = Math.floor((total % 81) / 9); 

        // Wstrzykiwanie wartości do zaktualizowanego HTML
        document.getElementById('idIron').innerText = displayDiamonds;
        document.getElementById('idDia').innerText = displayIronIngots;
    
        // Dolna sekcja (Stopka) - generuje dokładnie ten sam ciąg co wcześniej
        document.getElementById('mTot').innerHTML = uiText[currentLang].mainText(rawDia, mainNuggets);
        document.getElementById('res').classList.add('active');
    }

    
    function resetForm() {
        document.querySelectorAll('.sel').forEach(s => s.value = "0");
        document.querySelectorAll('.qty').forEach(q => q.value = "");
        document.getElementById('res').classList.remove('active');
    }
    
    initLayout();

</script>
</body>
</html>
